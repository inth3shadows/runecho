name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Format
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi
      # Test dependency for RUNECHO_GUARD_LINT (#333): the guard shells out to
      # `ruff` on PATH and fails OPEN (stays Skipped) without it, so its
      # hookcorpus fixtures cannot be exercised at all. Those fixtures SKIP
      # when ruff is missing (runHookCase, hookcorpus_test.go) so a
      # contributor's `go test ./...` stays green on a clean checkout -- which
      # means an un-installed ruff here would silently drop the ask-path
      # coverage rather than fail loudly. Installing it is what keeps that
      # coverage real in the one place it is actually gated. pipx
      # (preinstalled on this runner image) sidesteps Ubuntu 24.04's PEP 668
      # externally-managed-environment restriction on a plain `pip install`.
      # Version pinned to what lint.go's design was measured against.
      - name: Install ruff (RUNECHO_GUARD_LINT test dependency, #333)
        run: pipx install ruff==0.16.1
      # -v exists for one reason: without it `go test` prints only a per-package
      # `ok`, which makes a test that SKIPPED indistinguishable from one that
      # passed. Several tests here skip on a condition the runner controls rather
      # than the code -- ruff absent, a chmod that does not deny (CAP_DAC_OVERRIDE
      # or a filesystem ignoring mode bits), a stub that cannot exec on a noexec
      # TMPDIR. Each is a correct skip locally and a silent hole in coverage here,
      # and the non-verbose log could not tell the two apart: #341 shipped with
      # the claim "the pin is live in CI" resting on inference about the runner's
      # uid and filesystem, because nothing in the log could confirm it.
      #
      # set -o pipefail is load-bearing, not hygiene. GitHub runs `run:` under
      # `bash -e`, which does NOT propagate a failure from the left side of a
      # pipe -- so `go test | tee` without it reports tee's exit status and turns
      # a failing suite green. The step that makes skips visible would otherwise
      # be the step that hides failures.
      - name: Test (race + coverage, includes guard corpus gate)
        run: |
          set -o pipefail
          go test ./... -race -cover -v 2>&1 | tee test.log
      # The verbose log is ~3,800 lines to carry ~3 lines of payload, so the
      # payload is lifted into the run summary where it is read without scrolling.
      # `always()` because a skip that only appears on a FAILING run is exactly
      # the one worth seeing.
      #
      # "no SKIP lines" does NOT mean "nothing skipped" — it also describes a run
      # where no test ever started. On a compile error anywhere in the tree `tee`
      # still creates test.log, and it contains build errors and zero SKIP lines,
      # so a naive check reports "every test ran" on a red run: a positively
      # false coverage claim, which is the same unverified inference this step
      # exists to remove. `=== RUN` is the discriminator, verified rather than
      # assumed — a healthy run of this suite emits 1,778 of them and a build
      # failure emits none. `^FAIL` is NOT usable for this: `FAIL <pkg> [build
      # failed]` prints on exactly the run being excluded.
      - name: Report skipped tests
        if: always()
        run: |
          {
            echo "### Skipped tests"
            echo
            if [ ! -f test.log ]; then
              echo "_No test.log: the test step did not get far enough to produce one._"
            elif ! grep -q '^=== RUN' test.log; then
              echo "_No test executed — the build failed before any test started, so this run says nothing about what does or does not skip. See the Test step log._"
            elif skips=$(grep -E '^[[:space:]]*--- SKIP' test.log | sed 's/^[[:space:]]*//' | sort -u) && [ -n "$skips" ]; then
              echo '```'
              echo "$skips"
              echo '```'
            else
              echo "_None — every test ran._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Installer syntax
        run: bash -n install.sh
      # Scores the hook-fixture corpus: breaks one guard behaviour at a time and
      # fails if any fixture caught nothing, or if a mutation survived without a
      # written `known_gap` reason. The corpus is the only instrument reaching
      # eight of the guard's nine checks, and its failure mode is silent — a
      # fixture can pass forever while pinning nothing, which is what #227 was
      # filed about. `go test` above cannot see that; only this can.
      #
      # Pull requests only. It applies mutations to the working tree (restored in
      # a finally, and it refuses to start on a dirty one), so it is kept off any
      # job that could ever push, and off the master-push run where the same
      # commit has already been gated on its PR. Costs ~2-4 min.
      - name: Hook-fixture mutation gate
        if: github.event_name == 'pull_request'
        run: python3 bench/hookmutate/mutate.py --strict

  # The Dockerfile is the third shipping channel (the Glama MCP directory builds
  # and distributes from it), and it is the only one nothing else exercises: the
  # `test` job proves the source compiles, not that the image does. Without this
  # job the Dockerfile rots silently until Glama's next rebuild fails, which is a
  # failure we would learn about from a stranger's listing page rather than CI.
  #
  # Deliberately build-only — no registry, no push, no credentials, so the
  # workflow keeps `contents: read`. Plain `docker build` rather than the buildx
  # actions: this repo pins every action by SHA, and two more pinned third-party
  # deps buy nothing here when the runner already ships docker.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image
        run: docker build --build-arg RUNECHO_VERSION=ci-smoke -t runecho-mcp:ci .
      # A build that succeeds can still ship a server that cannot speak. This is
      # the same handshake Glama's inspection performs, so a pass here means the
      # listing will build AND enumerate tools, not merely compile.
      - name: Smoke-test the MCP server over stdio
        run: |
          set -euo pipefail
          out=$(printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' \
            | docker run --rm -i runecho-mcp:ci)
          echo "$out"
          # Asserting the stamped version, not just any response, is what proves
          # --build-arg threaded through install.sh. If that regressed, the image
          # would still answer -- reporting "dev" to every directory listing.
          echo "$out" | grep -q '"version":"ci-smoke"' || {
            echo "::error::initialize did not report the RUNECHO_VERSION build arg"; exit 1; }
          echo "$out" | grep -q '"name":"structure"' || {
            echo "::error::tools/list did not advertise the structure tool"; exit 1; }
