name: Release

on:
  push:
    tags: ["v*"]
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]
  pull_request:
    paths:
      - ".goreleaser.yaml"
      - ".github/workflows/release.yml"
      - "scripts/next-release.py"
      - "scripts/next-release-test.py"

permissions:
  contents: read

jobs:
  # PR-time: prove the config and build all tags/platforms without publishing,
  # so a broken .goreleaser.yaml fails CI here rather than during a real release.
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod }
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with: { version: "~> v2", args: "check" }
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with: { version: "~> v2", args: "build --snapshot --clean" }
      # The release decision logic is a script precisely so it can be exercised
      # without pushing a tag. A change to it must fail here, not in production.
      - name: Self-test the release decision logic
        run: python3 scripts/next-release-test.py

  # CI green on master: decide whether this merge is a release, and if so tag
  # and publish it. This is what removes "cut a tag" as a thing anyone has to
  # remember — see scripts/next-release.py for the bump rules.
  #
  # WHY `workflow_run` INSTEAD OF `push: branches: [master]` (#347): this job
  # used to fire on the same push that started CI, with no idea whether CI
  # would pass. #344/#346 proved a push can look entirely normal and still
  # have a red `test` job. `workflow_run` makes publication wait for the CI
  # workflow (name: "CI", ci.yml) to finish and checks its conclusion below —
  # a red `test` or `docker` job means the workflow conclusion is failure and
  # nothing here runs. `workflow_run` evaluates the workflow file from the
  # default branch, so this trigger only takes effect once merged to master.
  #
  # WHY THIS JOB PUBLISHES INSTEAD OF LETTING THE `release` JOB BELOW DO IT:
  # a tag pushed using GITHUB_TOKEN does NOT trigger another workflow run.
  # GitHub suppresses that to prevent recursion. So `on: push: tags` will not
  # fire for a tag this job creates, and the release has to happen right here or
  # not at all. That same suppression is what keeps the CHANGELOG commit below
  # from re-triggering CI (and so this job, transitively) — the skip-ci marker
  # is belt-and-braces.
  #
  # HAZARD, learned the hard way on this file's own first push: GitHub honours
  # that skip marker ANYWHERE in a commit message, body included. This repo
  # squash-merges with squash_merge_commit_message=PR_BODY, so a PR whose body
  # merely DESCRIBES the marker becomes a master commit message containing it —
  # and silently suppresses this job. If a release you expected did not happen,
  # check the merge commit message for the token before suspecting anything here.
  autorelease:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master' &&
      github.repository == 'inth3shadows/runecho'
    runs-on: ubuntu-latest
    # Waiting for CI (workflow_run) instead of starting on push, as this job
    # now does, means the gap between "commit tested" and "job starts" is
    # CI's full runtime, not the ~seconds an immediate push trigger left. Two
    # masters merges landing within that gap each fire their own workflow_run,
    # so without serializing them the second job's atomic push below can
    # collide with the first's non-fast-forward — queue instead of racing.
    # cancel-in-progress: false because an in-flight `git push`/goreleaser
    # publish must finish, not be killed mid-way.
    concurrency:
      group: autorelease
      cancel-in-progress: false
    permissions:
      contents: write
      # Both required by attest-build-provenance: id-token to mint the OIDC
      # token Sigstore signs against, attestations to store the result.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit CI actually tested — not whatever master has drifted to
          # by the time this job starts, which can be later (another merge
          # landed) or, on GITHUB_TOKEN push suppression failing open, this
          # job's own prior changelog commit.
          ref: ${{ github.event.workflow_run.head_sha }}
          # Full history AND tags: the version is computed from the highest
          # existing semver tag, which a shallow clone would not have.
          fetch-depth: 0

      # Queuing (above) stops two pushes racing each other, but a queued job
      # can still be built on a commit master has since moved past — e.g. two
      # merges landed inside CI's runtime and this run is for the older one,
      # now sitting behind the newer one's own already-published release. Its
      # `git push --atomic origin HEAD:master` below would fail non-fast-forward.
      # Detect that here and skip cleanly: the newer commit's own workflow_run
      # will decide the release from the (by-then) live tip, so nothing is
      # lost by deferring to it.
      - name: Guard against a stale base
        id: guard
        run: |
          tested="${{ github.event.workflow_run.head_sha }}"
          current="$(git rev-parse origin/master)"
          if [ "$current" != "$tested" ]; then
            echo "master is now at $current; this run tested $tested and is superseded. Deferring to that commit's own CI run."
            echo "stale=true" >> "$GITHUB_OUTPUT"
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Decide the release
        id: decide
        if: steps.guard.outputs.stale == 'false'
        run: |
          subject="$(git log -1 --format=%s)"
          echo "subject: $subject"
          python3 scripts/next-release.py --subject "$subject" --apply >> "$GITHUB_OUTPUT"

      - name: Report a skip
        if: steps.guard.outputs.stale == 'false' && steps.decide.outputs.version == ''
        run: echo "No release for this merge (${{ steps.decide.outputs.skip }})."

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.decide.outputs.version != ''
        with: { go-version-file: go.mod }

      - name: Commit the changelog and tag
        if: steps.decide.outputs.version != ''
        env:
          VERSION: ${{ steps.decide.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "chore(release): v${VERSION} [skip ci]"
          git tag -a "v${VERSION}" -m "v${VERSION}"
          # Push the commit and the tag as one atomic update: a tag without its
          # changelog commit, or the reverse, is a state nothing else recovers from.
          git push --atomic origin HEAD:master "refs/tags/v${VERSION}"

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        if: steps.decide.outputs.version != ''
        with: { version: "~> v2", args: "release --clean" }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # checksums.txt proves the archives weren't corrupted in transit; it does
      # NOT prove who built them, because anyone who can replace an archive can
      # replace the checksum file sitting next to it. Provenance closes that:
      # a signed, Sigstore-backed statement of which workflow, at which commit,
      # produced these exact bytes. Verify with:
      #   gh attestation verify runecho_<ver>_<os>_<arch>.tar.gz -R inth3shadows/runecho
      # Keyless (OIDC) — nothing to rotate, no secret to leak.
      - name: Attest build provenance
        if: steps.decide.outputs.version != ''
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: "dist/*.tar.gz,dist/*.zip,dist/checksums.txt"

  # Tag push: cut the real release with downloadable binaries + checksums.
  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod }
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with: { version: "~> v2", args: "release --clean" }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Same provenance attestation as the autorelease job above — both paths
      # publish downloadable binaries, so both must be verifiable.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: "dist/*.tar.gz,dist/*.zip,dist/checksums.txt"
